# Reusable workflow: build and release a self-contained .NET Windows service.
#
# Replaces the byte-identical (modulo APP_NAME / PROJECT_PATH /
# APPSETTINGS_SOURCE) build-release.yml duplicated in whisper-service and
# SysTTS. Companion repos call this with their three project-specific values:
#
#   # .github/workflows/build-release.yml in whisper-service:
#   name: Build and Release
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
#   jobs:
#     build:
#       uses: psford/claude-env/.github/workflows/windows-service-build-release.yml@main
#       with:
#         app_name: WhisperService
#         project_path: WhisperService/WhisperService.csproj
#         appsettings_source: WhisperService/appsettings.json
#       permissions:
#         contents: write
#
# The reusable workflow runs a two-job pipeline: NuGet vulnerability scan,
# then publish self-contained + zip + checksum + GitHub Release. Action
# versions are pinned to commit SHAs for supply-chain safety (matches the
# existing whisper-service / SysTTS pattern).

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Display name used in the release title and zip file'
        required: true
        type: string
      project_path:
        description: 'Relative path to the .csproj to publish (e.g. WhisperService/WhisperService.csproj)'
        required: true
        type: string
      appsettings_source:
        description: 'Relative path to the appsettings.json saved as a separate release asset'
        required: true
        type: string
      dotnet_version:
        description: '.NET SDK major version to install (default: 8.0)'
        required: false
        type: string
        default: '8.0'
      publish_dir:
        description: 'Local directory used for the dotnet publish output (default: publish)'
        required: false
        type: string
        default: 'publish'

jobs:
  vulnerability-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list ${{ inputs.project_path }} package --vulnerable --include-transitive 2>&1
          Write-Output $output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable NuGet packages detected. Fix before releasing."
            exit 1
          }

  build-and-release:
    needs: vulnerability-scan
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Publish self-contained
        run: >
          dotnet publish ${{ inputs.project_path }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o ${{ inputs.publish_dir }}

      - name: Remove user-configurable files from publish
        shell: pwsh
        run: |
          $publishDir = "${{ inputs.publish_dir }}"
          Remove-Item -Path "$publishDir/appsettings.json" -ErrorAction SilentlyContinue
          Remove-Item -Path "$publishDir/appsettings.Development.json" -ErrorAction SilentlyContinue
          Remove-Item -Path "$publishDir/models" -Recurse -ErrorAction SilentlyContinue

      - name: Save default appsettings as separate asset
        shell: pwsh
        run: |
          Copy-Item "${{ inputs.appsettings_source }}" "appsettings.default.json"

      - name: Create zip and checksum
        shell: pwsh
        run: |
          $zipName = "${{ inputs.app_name }}-win-x64.zip"
          Compress-Archive -Path "${{ inputs.publish_dir }}/*" -DestinationPath $zipName
          $hash = Get-FileHash -Path $zipName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ASCII

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ${{ inputs.app_name }} v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ inputs.app_name }}-win-x64.zip
            ${{ inputs.app_name }}-win-x64.zip.sha256
            appsettings.default.json
